<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributes</title>
    <style>
        .title {
            background-color: royalblue;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <h1>HTML Attributes</h1>
    </header>
    <a href="https://www.example.com" target="_blank" title="Visit Example.com">Visit Example.com</a><br>

    <h1 id="heading"> Welcome to my website</h1>
    <h2 class="title">First Heading</h2>
    <h2 class="title">Second Heading</h2>
    <h2 class="title">Third Heading</h2>

    <img src="image.jpg" alt="Description of the image" width="300" height="200"><br><br>


    <form action="/submit" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="120" required><br><br>
        <label for="gender">Gender:</label>
        <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select><br><br>
        <label for="bio">Bio:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Tell us about yourself..."></textarea><br><br>
        <label for="subscribe">Subscribe to newsletter:</label>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes"><br><br>
        <label for="color">Favorite Color:</label>
        <input type="color" id="color" name="color"><br><br>
        <label for="date">Select a date:</label>
        <input type="date" id="date" name="date"><br><br>
        <label for="file">Upload a file:</label>
        <input type="file" id="file" name="file"><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
